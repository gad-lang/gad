<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
    <defs>
        <style>
            .base-dark  { fill: #0D1B2A; } /* Contornos grossos para garantir contraste */
            .fur-orange { fill: #06B6D4; } /* Pele principal da gazela */
            .fur-light  { fill: #E0F7FA; } /* Faixa central e orelhas */
            .horn-silver{ fill: #BDC3C7; } /* Chifres claros e visíveis */
            .eye-white  { fill: #FFFFFF; } /* Olhos grandes estilo Go */
            .badge-red   { fill: #E53935; } /* GADT/GADX badge glyph */
            .badge-white { fill: #FFFFFF; } /* GADT/GADX badge outline/gap */
        </style>
    </defs>

    <!-- CHIFRES (topo, y=0) -->
    <rect x="5" y="0" width="2" height="4" class="base-dark" />
    <rect x="5" y="1" width="1" height="3" class="horn-silver" />

    <rect x="9" y="0" width="2" height="4" class="base-dark" />
    <rect x="10" y="1" width="1" height="3" class="horn-silver" />

    <!-- ORELHAS LATERAIS -->
    <rect x="1" y="5" width="3" height="2" class="base-dark" />
    <rect x="2" y="5" width="2" height="1" class="fur-orange" />

    <rect x="12" y="5" width="3" height="2" class="base-dark" />
    <rect x="12" y="5" width="2" height="1" class="fur-orange" />

    <!-- CABEÇA AFUNILADA PARA BAIXO (focinho de gazela, y=4 -> 16) -->
    <rect x="3" y="4" width="10" height="7" class="base-dark" />  <!-- topo largo (olhos) -->
    <rect x="4" y="11" width="8" height="2" class="base-dark" />  <!-- afunila 1 -->
    <rect x="5" y="13" width="6" height="3" class="base-dark" />  <!-- focinho -->

    <rect x="4" y="5" width="8" height="6" class="fur-orange" />
    <rect x="5" y="11" width="6" height="2" class="fur-orange" />
    <rect x="6" y="13" width="4" height="2" class="fur-orange" />

    <!-- LISTRA FACIAL CENTRAL -->
    <rect x="7" y="5" width="2" height="10" class="fur-light" />
    <rect x="7" y="14" width="2" height="1" class="base-dark" /> <!-- Nariz -->

    <!-- OLHOS GIGANTES (Estilo Mascote do Go) -->
    <!-- Olho Esquerdo -->
    <rect x="4" y="6" width="3" height="3" class="base-dark" />
    <rect x="4" y="6" width="2" height="2" class="eye-white" />
    <rect x="5" y="7" width="1" height="1" class="base-dark" /> <!-- Pupila -->

    <!-- Olho Direito -->
    <rect x="9" y="6" width="3" height="3" class="base-dark" />
    <rect x="10" y="6" width="2" height="2" class="eye-white" />
    <rect x="10" y="7" width="1" height="1" class="base-dark" /> <!-- Pupila -->
    <!-- GADX (pug) badge: 1px red @ + 1px white border/gap, bottom-right. -->
    <rect x="9" y="9" width="1" height="1" class="badge-white"/>
    <rect x="9" y="10" width="1" height="1" class="badge-white"/>
    <rect x="9" y="11" width="1" height="1" class="badge-white"/>
    <rect x="9" y="12" width="1" height="1" class="badge-white"/>
    <rect x="9" y="13" width="1" height="1" class="badge-white"/>
    <rect x="9" y="14" width="1" height="1" class="badge-white"/>
    <rect x="9" y="15" width="1" height="1" class="badge-white"/>
    <rect x="10" y="9" width="1" height="1" class="badge-white"/>
    <rect x="10" y="15" width="1" height="1" class="badge-white"/>
    <rect x="11" y="9" width="1" height="1" class="badge-white"/>
    <rect x="11" y="11" width="1" height="1" class="badge-white"/>
    <rect x="11" y="12" width="1" height="1" class="badge-white"/>
    <rect x="11" y="13" width="1" height="1" class="badge-white"/>
    <rect x="11" y="15" width="1" height="1" class="badge-white"/>
    <rect x="12" y="9" width="1" height="1" class="badge-white"/>
    <rect x="12" y="11" width="1" height="1" class="badge-white"/>
    <rect x="12" y="13" width="1" height="1" class="badge-white"/>
    <rect x="12" y="15" width="1" height="1" class="badge-white"/>
    <rect x="13" y="9" width="1" height="1" class="badge-white"/>
    <rect x="13" y="11" width="1" height="1" class="badge-white"/>
    <rect x="13" y="12" width="1" height="1" class="badge-white"/>
    <rect x="13" y="13" width="1" height="1" class="badge-white"/>
    <rect x="13" y="15" width="1" height="1" class="badge-white"/>
    <rect x="14" y="9" width="1" height="1" class="badge-white"/>
    <rect x="14" y="13" width="1" height="1" class="badge-white"/>
    <rect x="14" y="15" width="1" height="1" class="badge-white"/>
    <rect x="15" y="9" width="1" height="1" class="badge-white"/>
    <rect x="15" y="10" width="1" height="1" class="badge-white"/>
    <rect x="15" y="11" width="1" height="1" class="badge-white"/>
    <rect x="15" y="12" width="1" height="1" class="badge-white"/>
    <rect x="15" y="13" width="1" height="1" class="badge-white"/>
    <rect x="15" y="14" width="1" height="1" class="badge-white"/>
    <rect x="15" y="15" width="1" height="1" class="badge-white"/>
    <rect x="10" y="10" width="1" height="1" class="badge-red"/>
    <rect x="10" y="11" width="1" height="1" class="badge-red"/>
    <rect x="10" y="12" width="1" height="1" class="badge-red"/>
    <rect x="10" y="13" width="1" height="1" class="badge-red"/>
    <rect x="10" y="14" width="1" height="1" class="badge-red"/>
    <rect x="11" y="10" width="1" height="1" class="badge-red"/>
    <rect x="11" y="14" width="1" height="1" class="badge-red"/>
    <rect x="12" y="10" width="1" height="1" class="badge-red"/>
    <rect x="12" y="12" width="1" height="1" class="badge-red"/>
    <rect x="12" y="14" width="1" height="1" class="badge-red"/>
    <rect x="13" y="10" width="1" height="1" class="badge-red"/>
    <rect x="13" y="14" width="1" height="1" class="badge-red"/>
    <rect x="14" y="10" width="1" height="1" class="badge-red"/>
    <rect x="14" y="11" width="1" height="1" class="badge-red"/>
    <rect x="14" y="12" width="1" height="1" class="badge-red"/>
    <rect x="14" y="14" width="1" height="1" class="badge-red"/>
</svg>
