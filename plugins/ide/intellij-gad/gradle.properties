# Plugin coordinates
pluginGroup = dev.gad-lang.gad
pluginName = Gad Language
pluginVersion = 0.1.0

# Plugin ID (must match <id> in plugin.xml) and the compatible IDE build range.
pluginId = dev.gad-lang.gad
pluginSinceBuild = 242
pluginUntilBuild = 243.*

# Target IntelliJ Platform: IntelliJ IDEA Community 2024.2. A single plugin built
# against the platform runs in all JetBrains IDEs (GoLand, WebStorm, PyCharm, …).
platformType = IC
platformVersion = 2024.2

# Bundled platform plugins the plugin depends on.
platformBundledPlugins = org.jetbrains.plugins.textmate

# Toolchain
javaVersion = 21

# Gradle
org.gradle.configuration-cache = true
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
