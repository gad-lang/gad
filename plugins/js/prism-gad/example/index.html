<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>prism-gad — highlighting demo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css"
    />
    <style>
      body {
        font: 14px/1.5 system-ui, sans-serif;
        margin: 2rem auto;
        max-width: 60rem;
        padding: 0 1rem;
        background: #1d1f21;
        color: #c5c8c6;
      }
      h1 { font-size: 1.25rem; }
      a { color: #81a2be; }
      #layout { display: grid; grid-template-columns: 16rem 1fr; gap: 1rem; align-items: start; }
      #tree {
        border: 1px solid #444; border-radius: 8px; padding: 0.5rem;
        max-height: 36rem; overflow: auto; font-size: 13px; background: #282a2e;
      }
      #tree details { margin-left: 0.25rem; }
      #tree summary { cursor: pointer; color: #969896; padding: 0.1rem 0; user-select: none; }
      #tree .tree-children { margin-left: 0.75rem; border-left: 1px solid #3a3d41; padding-left: 0.4rem; }
      #tree button.file {
        display: block; width: 100%; text-align: left; font: inherit;
        padding: 0.15rem 0.4rem; border: 0; border-radius: 5px;
        background: transparent; cursor: pointer; color: #c5c8c6;
      }
      #tree button.file:hover { background: #34373b; }
      #tree button.file img.file-icon {
        width: 16px; height: 16px; vertical-align: -3px; margin-right: 0.35rem;
        image-rendering: pixelated;
      }
      #tree button.file.active { background: #2563eb; color: #fff; }
      #out pre { border-radius: 8px; padding: 1rem; overflow: auto; margin: 0; max-height: 36rem; }
    </style>
  </head>
  <body>
    <h1>prism-gad — Gad syntax highlighting</h1>
    <p>
      Static highlighting with <a href="https://prismjs.com/">PrismJS</a> and the
      <code>@gad-lang/prism-gad</code> grammar. The sidebar is a tree of the
      repository <code>samples/</code> directory; click a
      <code>.gad</code>&nbsp;/&nbsp;<code>.gadt</code>&nbsp;/&nbsp;<code>.gadx</code>
      file to highlight it with the grammar chosen by
      <code>gadGrammarFor(sourceType)</code>. Serve with <code>bun run demo</code>.
    </p>
    <div id="layout">
      <aside id="tree"></aside>
      <div id="out"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
