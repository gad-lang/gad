name: website

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

# Allow only one concurrent deployment, so commit and release builds don't race
# each other while merging into the gh-pages branch.
concurrency:
  group: website
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    name: Build and publish the documentation website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      # bun builds the embedded ide-vuetify demo that backs the Playground page.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # Resolve the release to feature on the site. On a release event use its
      # fields; on a main push (releases created by GITHUB_TOKEN don't trigger the
      # release event) fall back to the latest published release via the API, so
      # the banner stays current. Values go to files to avoid injection / quoting.
      - name: Resolve release info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          E_TAG: ${{ github.event.release.tag_name }}
          E_NAME: ${{ github.event.release.name }}
          E_DATE: ${{ github.event.release.published_at }}
          E_BODY: ${{ github.event.release.body }}
        run: |
          set -eu
          : > /tmp/rel_tag; : > /tmp/rel_name; : > /tmp/rel_date; : > /tmp/relnotes.md
          if [ "$EVENT_NAME" = "release" ]; then
            printf '%s' "$E_TAG"  > /tmp/rel_tag
            printf '%s' "$E_NAME" > /tmp/rel_name
            printf '%s' "$E_DATE" > /tmp/rel_date
            printf '%s' "$E_BODY" > /tmp/relnotes.md
          else
            tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""' || true)"
            if [ -n "$tag" ]; then
              printf '%s' "$tag" > /tmp/rel_tag
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json name --jq '.name // ""' > /tmp/rel_name || true
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt // ""' > /tmp/rel_date || true
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > /tmp/relnotes.md || true
            fi
          fi

      - name: Build website
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -eu
          args=(build --out dist/website --repo-url "$REPO_URL")
          tag="$(cat /tmp/rel_tag)"
          if [ -n "$tag" ]; then
            args+=(--release-tag "$tag" \
                   --release-name "$(cat /tmp/rel_name)" \
                   --release-date "$(cat /tmp/rel_date)" \
                   --release-notes-file /tmp/relnotes.md)
          fi
          go run ./cmd/build-website "${args[@]}"

      - name: Compute publish paths
        id: paths
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "dir=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage publish directory
        run: |
          set -eu
          dir='${{ steps.paths.outputs.dir }}'
          # Keep a permanent copy under the tag/commit dir …
          mkdir -p "public/$dir"
          cp -r dist/website/. "public/$dir/"
          # … also publish under the release tag so the release notes' docs link
          # (/<tag>/) resolves even for token-created releases (whose `release`
          # event never triggers this workflow) …
          rel_tag="$(cat /tmp/rel_tag)"
          if [ -n "$rel_tag" ] && [ "$rel_tag" != "$dir" ]; then
            rm -rf "public/$rel_tag" && mkdir -p "public/$rel_tag"
            cp -r dist/website/. "public/$rel_tag/"
          fi
          # … and refresh /latest, which the site root redirects to, so both a
          # release event and a main push update the live site.
          rm -rf public/latest && mkdir -p public/latest
          cp -r dist/website/. public/latest/
          # Root index redirects to the latest published build.
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./latest/index.html"><title>Gad</title><a href="./latest/index.html">Gad documentation</a>\n' > public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # keep_files preserves previously published commit/version directories
          # so each build accumulates under its own /<commit-id> or /<tag> path.
          keep_files: true
          destination_dir: .
          commit_message: "docs: publish website for ${{ steps.paths.outputs.dir }}"
