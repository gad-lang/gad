name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # actions: write lets this workflow dispatch the website workflow after the
  # release is published (workflow_dispatch is an exception to the rule that the
  # GITHUB_TOKEN doesn't trigger further workflow runs).
  actions: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser creates the release with the GITHUB_TOKEN, which does not
      # trigger the website workflow's `release` event. Dispatch it explicitly so
      # the docs site publishes /latest and /<tag> for the new release.
      - name: Trigger website rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run website.yml --repo "${{ github.repository }}" --ref main
