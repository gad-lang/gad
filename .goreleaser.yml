version: 2

project_name: gad

before:
  hooks:
    - make goreleaser-setup
    # Build the WebAssembly module (gad.wasm, debugger-enabled) and wasm_exec.js
    # into ./wasm-assets; they are attached to the release via extra_files below.
    - bash scripts/build-wasm.sh ./wasm-assets

builds:
  - id: gad
    main: ./cmd/gad
    binary: gad
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=go1.26.6+auto
    tags:
      - prod
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # CLI binaries: Linux and Windows on amd64 and arm64.
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: gad
    ids:
      - gad
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Docs are published on GitHub Pages, not shipped in the CLI archives.
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: gad-lang
    name: gad
  draft: false
  prerelease: auto
  # Link the documentation website (this tag's build + the latest docs) at the
  # end of the generated release notes.
  footer: |
    ---
    📖 **Documentation:** https://gad-lang.github.io/{{ .Tag }}/ · [latest](https://gad-lang.github.io/latest/)
  # Attach the standalone WebAssembly module (built by the before hook) as a
  # release asset alongside the CLI archives.
  extra_files:
    - glob: ./wasm-assets/gad.wasm
    - glob: ./wasm-assets/wasm_exec.js
