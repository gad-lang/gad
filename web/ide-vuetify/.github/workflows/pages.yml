# Build the server-less Vuetify IDE demo and deploy it to GitHub Pages.
#
# The demo needs the Gad WASM module; standalone (here) it is fetched from the
# published docs site by scripts/build-wasm.sh (override with GAD_WASM_BASE), and
# the read-only sample tree falls back to a small built-in set (gen-samples.ts).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Build the demo (base=./ for project pages)
        working-directory: demo
        run: |
          bun install
          bun run samples
          bun run wasm
          bunx vite build --base=./
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
