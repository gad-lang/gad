# gad fmt now defaults to a column-aware layout: list constructs (arrays, dicts,
# call arguments, …) stay on one line and wrap to one item per line only when
# they would overflow the column budget (--max-columns, default 80). The old
# keep-on-one-line keys (no-array-item-in-new-line, …) are therefore obsolete and
# no fmt options are needed here. To force a construct onto separate lines use the
# opt-in flags/keys (array-item-in-new-line, …) or --format.
#
# The indentation unit is configurable and applies to every dialect
# (.gad / .gadt / .gadx). It defaults to a single tab; uncomment to change it:
#
# fmt:
#   indent: "2"     # 2 spaces per level ("tab" = one tab, "2t" = two tabs, …)
